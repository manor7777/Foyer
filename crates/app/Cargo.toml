[package]
name = "foyer"
version.workspace = true
edition.workspace = true
build = "build.rs"

[lib]
name = "foyer"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "foyer"
path = "src/main.rs"

[dependencies]
emby-api = { path = "../emby-api" }
seerr-api = { path = "../seerr-api" }
player = { path = "../player" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
slint = { version = "1.18", features = ["unstable-winit-030"] }
sevenz-rust2 = "0.13"
notify-rust = "4"

[target.'cfg(target_os = "android")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-femtovg", "accessibility", "gettext", "image-default-formats", "backend-android-activity-06"] }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.19"
windows-sys = { version = "0.59", features = ["Win32_System_Registry", "Win32_Foundation", "Win32_System_Power"] }
windows = { version = "0.62", features = ["Foundation", "Media", "Win32_Foundation", "Win32_System_WinRT"] }

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"

# Android packaging (cargo-apk). libmpv.so per ABI goes in crates/app/android/libs/<abi>/ (not committed;
# the CI job fetches it). One APK runs on phones, tablets and Android TV.
[package.metadata.android]
package = "app.foyer.player"
apk_name = "Foyer"
# Set by CI from the workspace version (major*10000 + minor*100 + patch); Android only installs updates with a higher code.
version_code = 1
build_targets = ["aarch64-linux-android"]
runtime_libs = "android/libs"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Foyer"
theme = "@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|uiMode"
orientation = "unspecified"

# Touchscreen is optional so the APK installs on Android TV, which has none.
[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

[[package.metadata.android.uses_feature]]
name = "android.software.leanback"
required = false

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

# Shows up in both the phone launcher and the TV launcher.
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER", "android.intent.category.LEANBACK_LAUNCHER"]
