[package]
name = "foyer"
version.workspace = true
edition.workspace = true
build = "build.rs"

[dependencies]
emby-api = { path = "../emby-api" }
seerr-api = { path = "../seerr-api" }
player = { path = "../player" }
slint = { version = "1.18", features = ["unstable-winit-030"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sevenz-rust2 = "0.13"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
notify-rust = "4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Registry", "Win32_Foundation"] }

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"
