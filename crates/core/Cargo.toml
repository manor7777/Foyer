[package]
name = "foyer-core"
version.workspace = true
edition.workspace = true

# Platform-neutral logic shared by every build of Foyer (Windows, Android phone and TV): settings,
# playback-quality rules, formatting and colour maths. No UI and no OS calls, so it is fast to test.

[dependencies]
emby-api = { path = "../emby-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
