name: Release

# Manual only: Actions > Release > Run workflow. Builds Foyer.exe (Windows) and Foyer.apk (Android phone and
# TV, one universal APK) and publishes both. The version comes from Cargo.toml
# ([workspace.package] version); bump it and add a "## Foyer <version>" section to
# CHANGELOG.md first, then run this.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (optional; defaults to the CHANGELOG.md section for this version)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the signing key is set
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::Repository secret UPDATE_SIGNING_KEY is not set (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Work out the version
        id: plan
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. Bump the version in Cargo.toml first."
            exit 1
          fi
          # Notes: the workflow input if given, else the "## Foyer <version>" section of CHANGELOG.md.
          if [ -n "$NOTES" ]; then
            echo "$NOTES" > notes.md
          else
            awk -v h="## Foyer $version" '$0 == h {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
            if ! grep -q '[^[:space:]]' notes.md; then
              echo "::error::CHANGELOG.md has no '## Foyer $version' section. Write the release notes first."
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --workspace

      - name: Build (release, C runtime linked in)
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release --locked -p foyer

      - name: Check the exe needs no extra DLLs
        run: |
          bad="$(grep -aoiE '(vcruntime|msvcp|concrt|ucrtbase|api-ms-win-crt)[a-z0-9_.-]*\.dll' target/release/foyer.exe | sort -u || true)"
          if [ -n "$bad" ]; then echo "::error::exe depends on redistributable DLLs: $bad"; exit 1; fi

      - name: Package
        run: |
          cp target/release/foyer.exe Foyer.exe
          # The version is signed along with the hash, so an old build can't be passed off as a new release.
          { sha256sum Foyer.exe | awk '{print $1}'; echo "version=${{ steps.plan.outputs.version }}"; } > Foyer.exe.sha256

      - name: Sign the checksum (ECDSA P-256; Foyer refuses updates without a valid signature)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" -out Foyer.exe.sha256.sig Foyer.exe.sha256
          rm -f "$RUNNER_TEMP/key.pem"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            Foyer.exe
            Foyer.exe.sha256
            Foyer.exe.sha256.sig
            notes.md
          if-no-files-found: error

  android:
    uses: ./.github/workflows/android.yml
    with:
      release: true
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
      - uses: actions/download-artifact@v4
        with:
          name: Foyer-apk

      - name: Sign the APK checksum (same scheme as the exe, for the future in-app Android updater)
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          { sha256sum Foyer.apk | awk '{print $1}'; echo "version=${{ needs.windows.outputs.version }}"; } > Foyer.apk.sha256
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" -out Foyer.apk.sha256.sig Foyer.apk.sha256
          rm -f "$RUNNER_TEMP/key.pem"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.windows.outputs.tag }}" \
            Foyer.exe Foyer.exe.sha256 Foyer.exe.sha256.sig \
            Foyer.apk Foyer.apk.sha256 Foyer.apk.sha256.sig \
            --repo "${{ github.repository }}" \
            --title "Foyer ${{ needs.windows.outputs.version }}" \
            --notes-file notes.md --target "$GITHUB_SHA" --latest
