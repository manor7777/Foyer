name: Android

# Runs on every push and pull request to main (and the android branch) so a change that breaks the
# Android build is caught straight away, and is called by the Release workflow to produce Foyer.apk.
# One universal APK covers phones, tablets and Android TV / Google TV / Chromecast with Google TV.
on:
  push:
    branches: [main, android]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Sign with the real release key, so the APK installs over a released Foyer. Builds only: nothing is published."
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        description: "Sign with the release keystore secrets (fails if they are missing)"
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Test (shared code, Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
          cargo test --locked --workspace

      - name: Fetch libmpv for Android
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional override: URL of a zip holding arm64-v8a/*.so (repository variable ANDROID_LIBMPV_URL).
          # Normally unset: the zip comes from this repo's `libmpv-android` release, built by libmpv-android.yml.
          OVERRIDE_URL: ${{ vars.ANDROID_LIBMPV_URL }}
          RELEASE: ${{ inputs.release }}
        run: |
          mkdir -p crates/app/android/libs/arm64-v8a
          fetch_from_release() {
            gh release download libmpv-android --repo "$GITHUB_REPOSITORY" --pattern libmpv-android-arm64.zip --output libmpv.zip 2>/dev/null
          }
          fetch_from_run_artifact() {
            # Newest runs of the libmpv workflow first; the first one that still has its artifact wins.
            for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow libmpv-android.yml --limit 15 --json databaseId --jq '.[].databaseId'); do
              rm -rf libmpv-dl
              if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name libmpv-android-arm64 --dir libmpv-dl 2>/dev/null && [ -f libmpv-dl/libmpv-android-arm64.zip ]; then
                mv libmpv-dl/libmpv-android-arm64.zip libmpv.zip
                echo "Using the libmpv artifact from run $id"
                return 0
              fi
            done
            return 1
          }
          if [ -n "$OVERRIDE_URL" ]; then
            curl -fsSL "$OVERRIDE_URL" -o libmpv.zip
          else
            fetch_from_release || fetch_from_run_artifact || {
              if [ "$RELEASE" = "true" ]; then
                echo "::error::No libmpv build found: run the 'libmpv for Android' workflow first. Refusing to release an APK with no video."
                exit 1
              fi
              echo "::warning::No libmpv build found (run the 'libmpv for Android' workflow): this APK has no video engine."
            }
          fi
          if [ -f libmpv.zip ]; then
            unzip -q -o libmpv.zip -d crates/app/android/libs
            ls -l crates/app/android/libs/arm64-v8a
          fi

      - name: Signing key
        env:
          RELEASE: ${{ inputs.release }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ "$RELEASE" = "true" ]; then
            if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
              echo "::error::Release builds need the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets."
              exit 1
            fi
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            # Throwaway key: test builds only, never published.
            keytool -genkeypair -keystore "$RUNNER_TEMP/ci.keystore" -storepass android -keypass android \
              -alias ci -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Foyer CI test build"
            echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/ci.keystore" >> "$GITHUB_ENV"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Build APK
        working-directory: crates/app
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo apk build --release --lib

      - name: Name the APK
        run: cp target/release/apk/Foyer.apk Foyer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Foyer-apk
          path: Foyer.apk
          if-no-files-found: error
