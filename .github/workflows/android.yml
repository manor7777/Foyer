name: Android

# Runs on every push and pull request to main (and the android branch) so a change that breaks the
# Android build is caught straight away, and is called by the Release workflow to produce Foyer.apk.
# One universal APK covers phones, tablets and Android TV / Google TV / Chromecast with Google TV.
on:
  push:
    branches: [main, android]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: "Sign with the real release key, so the APK installs over a released Foyer. Builds only: nothing is published."
        type: boolean
        default: false
      armv7_only:
        description: "32-bit only (armeabi-v7a): a much smaller APK for 32-bit devices such as Chromecast with Google TV. Artifact Foyer-armv7-apk."
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        description: "Sign with the release keystore secrets (fails if they are missing)"
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2

      - name: Test (shared code, Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
          cargo test --locked --workspace

      - name: Fetch libmpv for Android
        env:
          GH_TOKEN: ${{ github.token }}
          # Optional override: URL of a zip holding arm64-v8a/*.so (the 64-bit engine only) (repository variable ANDROID_LIBMPV_URL).
          # Normally unset: the zip comes from this repo's `libmpv-android` release, built by libmpv-android.yml.
          OVERRIDE_URL: ${{ vars.ANDROID_LIBMPV_URL }}
          RELEASE: ${{ inputs.release }}
          ARMV7_ONLY: ${{ inputs.armv7_only }}
        run: |
          mkdir -p crates/app/android/libs
          # One zip per CPU type (arm64 = 64-bit, armv7 = 32-bit-only devices such as many Android TVs).
          fetch_from_release() {
            gh release download libmpv-android --repo "$GITHUB_REPOSITORY" --pattern "libmpv-android-$1.zip" --output "libmpv-$1.zip" 2>/dev/null
          }
          fetch_from_run_artifact() {
            # Newest runs of the libmpv workflow first; the first one that still has its artifact wins.
            for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow libmpv-android.yml --limit 15 --json databaseId --jq '.[].databaseId'); do
              rm -rf "libmpv-dl-$1"
              if gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "libmpv-android-$1" --dir "libmpv-dl-$1" 2>/dev/null && [ -f "libmpv-dl-$1/libmpv-android-$1.zip" ]; then
                mv "libmpv-dl-$1/libmpv-android-$1.zip" "libmpv-$1.zip"
                echo "Using the libmpv ($1) artifact from run $id"
                return 0
              fi
            done
            return 1
          }
          cpus="arm64 armv7"
          if [ "$ARMV7_ONLY" = "true" ]; then cpus=armv7; fi
          for cpu in $cpus; do
            if [ -n "$OVERRIDE_URL" ] && [ "$cpu" = arm64 ]; then
              curl -fsSL "$OVERRIDE_URL" -o libmpv-arm64.zip
            else
              fetch_from_release "$cpu" || fetch_from_run_artifact "$cpu" || {
                if [ "$RELEASE" = "true" ]; then
                  echo "::error::No libmpv ($cpu) build found: run the 'libmpv for Android' workflow first. Refusing to release an APK without it."
                  exit 1
                fi
                echo "::warning::No libmpv ($cpu) build found (run the 'libmpv for Android' workflow): this APK has no video engine for that CPU type."
              }
            fi
            if [ -f "libmpv-$cpu.zip" ]; then
              unzip -q -o "libmpv-$cpu.zip" -d crates/app/android/libs
            fi
          done
          ls -l crates/app/android/libs/*

      - name: Signing key
        env:
          RELEASE: ${{ inputs.release }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ "$RELEASE" = "true" ]; then
            if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
              echo "::error::Release builds need the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository secrets."
              exit 1
            fi
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          else
            # Throwaway key: test builds only, never published.
            keytool -genkeypair -keystore "$RUNNER_TEMP/ci.keystore" -storepass android -keypass android \
              -alias ci -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Foyer CI test build"
            echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/ci.keystore" >> "$GITHUB_ENV"
            echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      # cargo-apk 0.10 cannot write android:supportsPictureInPicture, so build it with a one-line patch.
      - name: Cache patched cargo-apk
        id: capk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-apk
          key: cargo-apk-pip-${{ hashFiles('.github/scripts/patch-cargo-apk.py') }}

      - name: Install cargo-apk (patched for picture-in-picture)
        if: steps.capk.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/capk" && cd "$RUNNER_TEMP/capk"
          curl -sSfL https://crates.io/api/v1/crates/cargo-apk/0.10.0/download | tar xz
          curl -sSfL https://crates.io/api/v1/crates/ndk-build/0.10.0/download | tar xz
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch-cargo-apk.py" ndk-build-0.10.0 cargo-apk-0.10.0
          cargo install --path cargo-apk-0.10.0 --force

      - name: Build the media-session helper (dex)
        run: .github/scripts/build-mediacb.sh

      - name: Build APK
        working-directory: crates/app
        env:
          ARMV7_ONLY: ${{ inputs.armv7_only }}
        run: |
          if [ "$ARMV7_ONLY" = "true" ]; then
            sed -i 's/^build_targets = .*/build_targets = ["armv7-linux-androideabi"]/' Cargo.toml
            grep -n '^build_targets' Cargo.toml
          fi
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          cargo apk build --release --lib

      - name: Name the APK
        run: cp target/release/apk/Foyer.apk Foyer.apk

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.armv7_only }}
        with:
          name: Foyer-apk
          path: Foyer.apk
          if-no-files-found: error

      - name: Name the 32-bit APK
        if: ${{ inputs.armv7_only }}
        run: mv Foyer.apk Foyer-armv7.apk

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.armv7_only }}
        with:
          name: Foyer-armv7-apk
          path: Foyer-armv7.apk
          if-no-files-found: error
