name: Android

# Manual for now: builds an APK and attaches it to the run. It joins the release workflow
# (step 5 of docs/ANDROID-PLAN.md) once it has been tried on a real phone and TV.
on:
  push:
    branches: [ccr-bc4da000-icx77u]
    paths: ["crates/**", "Cargo.*", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      libmpv_url:
        description: "URL of a zip with libmpv.so per ABI (arm64-v8a/libmpv.so ...). Leave empty to build without video."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Test (shared code, Linux)
        run: |
          sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
          cargo test --locked --workspace

      - name: Fetch libmpv
        env:
          URL: ${{ inputs.libmpv_url }}
        run: |
          mkdir -p crates/app/android/libs
          if [ -n "$URL" ]; then
            curl -fsSL "$URL" -o libmpv.zip
            unzip -q libmpv.zip -d crates/app/android/libs
          else
            echo "No libmpv given: building an APK without the video engine."
          fi

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Build APK
        working-directory: crates/app
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ANDROID_NDK_HOME"
          mkdir -p android/libs/arm64-v8a
          # Throwaway key for CI test builds only. Real releases sign with the secret keystore (plan step 5);
          # cargo-apk reads these same two variables.
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.keystore" -storepass android -keypass android \
            -alias ci -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Foyer CI test build"
          export CARGO_APK_RELEASE_KEYSTORE="$RUNNER_TEMP/ci.keystore"
          export CARGO_APK_RELEASE_KEYSTORE_PASSWORD=android
          cargo apk build --release --lib

      - uses: actions/upload-artifact@v4
        with:
          name: Foyer-apk
          path: target/release/apk/Foyer.apk
          if-no-files-found: error
